<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="rubix cube">
    </section>

    <section>
        <h2>Payment Information</h2>
        <form>

            <label for="card-name">Card Name</label>
            <input type="text" id="card-name" name="card-name" placeholder="ex:San" required aria-required="true">

            <label for="cardholder">CardHolder</label>
    <input type="text" id="cardholder" name="cardholder" placeholder="ex: San" required aria-required="true" />

            <label for="card-number">Card Number</label>
            <input id="card-number" name="card-number" type="text" placeholder="xxx-xxx-xxx" required aria-required="true">

            <label for="expiry-date">Expiry-Date</label>
            <input type="date" id="expiry-date" name="expiry-date">

        <button type="submit">Submit</button>

        </form>
    </section>
</body>

</html>
